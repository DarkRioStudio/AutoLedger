app_info:
  zh-Hans:
    name: "AutoLedger - 一键记账"
    subtitle: "截图、语音、酒店水单自动整理"
    privacyPolicyUrl: "https://getautoledger.app/privacy"
    privacyPolicyText: "AutoLedger 会在 Apple TV 版中显示只读月报、账本摘要和最近记录。账本资料优先保存在设备本地；如果使用 iCloud，同步会通过用户自己的 iCloud 账户完成。AutoLedger 不出售用户资料，也不使用第三方广告追踪。Apple TV 版不提供相机、麦克风、照片、信箱或酒店水单 PDF 导入。截图识别、收据辨识、饭店水单汇入、本机信箱扫描和 Pro 自动化主要在 iPhone、iPad 和 Mac 上完成。"
  zh-Hant:
    name: "AutoLedger - 一鍵記帳"
    subtitle: "截圖、語音、飯店水單自動整理"
    privacyPolicyUrl: "https://getautoledger.app/privacy"
    privacyPolicyText: "AutoLedger 會在 Apple TV 版中顯示唯讀月報、帳本摘要和最近記錄。帳本資料優先保存在裝置本機；如果使用 iCloud，同步會透過使用者自己的 iCloud 帳戶完成。AutoLedger 不出售使用者資料，也不使用第三方廣告追蹤。Apple TV 版不提供相機、麥克風、照片、信箱或飯店水單 PDF 匯入。截圖辨識、收據辨識、飯店水單匯入、本機信箱掃描和 Pro 自動化主要在 iPhone、iPad 和 Mac 上完成。"
  en-US:
    name: "AutoLedger - Quick Ledger"
    subtitle: "Screenshots, voice & folios"
    privacyPolicyUrl: "https://getautoledger.app/privacy"
    privacyPolicyText: "AutoLedger for Apple TV shows read-only monthly reports, ledger summaries, and recent entries. Ledger data is stored on device first. If iCloud sync is enabled, syncing uses the user's own iCloud account. AutoLedger does not sell user data and does not use third-party advertising tracking. The Apple TV app does not import camera, microphone, photos, email, or hotel folio PDF content. Screenshot recognition, receipt review, hotel folio import, local email scanning, and Pro automation are mainly available on iPhone, iPad, and Mac."
  ja:
    name: "AutoLedger - 簡単記帳"
    subtitle: "スクショ、音声、ホテル明細を整理"
    privacyPolicyUrl: "https://getautoledger.app/privacy"
    privacyPolicyText: "Apple TV 版 AutoLedger では、月次レポート、台帳概要、最近の記録を読み取り専用で表示します。台帳データはまず端末内に保存され、iCloud 同期を有効にした場合は利用者自身の iCloud アカウントで同期されます。AutoLedger は利用者データを販売せず、第三者広告トラッキングも使用しません。Apple TV 版ではカメラ、マイク、写真、メール、ホテル明細 PDF の取り込みは行いません。スクリーンショット認識、レシート確認、ホテル明細取り込み、ローカルメールスキャン、Pro 自動化は主に iPhone、iPad、Mac で利用できます。"
  ko:
    name: "AutoLedger - 빠른 가계부"
    subtitle: "스크린샷, 음성, 호텔 명세서 정리"
    privacyPolicyUrl: "https://getautoledger.app/privacy"
    privacyPolicyText: "Apple TV용 AutoLedger는 읽기 전용 월간 보고서, 장부 요약, 최근 기록을 표시합니다. 장부 데이터는 먼저 기기에 저장되며, iCloud 동기화를 켜면 사용자의 iCloud 계정을 통해 동기화됩니다. AutoLedger는 사용자 데이터를 판매하지 않으며 타사 광고 추적을 사용하지 않습니다. Apple TV 앱은 카메라, 마이크, 사진, 이메일 또는 호텔 명세서 PDF를 가져오지 않습니다. 스크린샷 인식, 영수증 확인, 호텔 명세서 가져오기, 로컬 이메일 스캔, Pro 자동화는 주로 iPhone, iPad, Mac에서 사용할 수 있습니다."

version_localizations:
  zh-Hans:
    promotionalText: "截图、拍照或说一句话，AutoLedger 会先整理金额、商户和时间，等你确认后再写入本地账本。现已支持实时 OCR 与酒店水单归档。"
    description: |-
      AutoLedger - 一键记账

      把截图、小票、语音和酒店水单整理成你的个人账本。

      AutoLedger 是一款本地优先的个人账本应用，帮助你减少重复输入，轻松记录日常消费。你可以从已经存在的消费信息开始：支付截图、照片小票、语音记录、快捷指令，以及酒店水单。

      实时 OCR 可以快速识别票据和账单中的金额、商户和时间。识别结果会在保存前进入确认流程，你可以检查、修改后再写入账本。AutoLedger 不会未经确认自动创建交易，让你始终掌握自己的消费记录。

      快速记录

      支持截图记账、拍照识别、语音记账、文本输入、快捷指令、分享扩展和 Apple Watch 快速记录。

      通过多账本管理、自定义分类、消费趋势、月度报告、数据导入导出和 iCloud 同步，帮助你长期维护自己的消费历史。

      酒店消费归档

      旅行和商务住宿通常比普通消费包含更多信息。酒店水单可能包含入住日期、晚数、房费、税费、服务费、餐饮和其他消费。

      AutoLedger 可以整理酒店水单 PDF，将住宿信息和消费记录保存为结构化酒店档案，方便回顾旅行经历和管理商务支出。

      Apple 生态体验

      在 iPhone、iPad、Mac 和 Apple Watch 上使用 AutoLedger。手机快速记录，大屏整理查看，随时保持自己的账本更新。

      AutoLedger Pro

      Pro 提供更多省时间的自动化能力，包括酒店水单自动整理、专属水单收件箱、批量候选处理、高级搜索、订阅异常提醒、月结资料整理和高级规则自动化。

      基础记账能力长期可用。Pro 的目标是减少重复操作，而不是限制你的账本数据。
    keywords: "记账,账本,截图记账,酒店水单,订阅管理,月报,快捷指令,OCR"
    supportUrl: "https://getautoledger.app/support"
    marketingUrl: "https://getautoledger.app"
    whatsNew: "新增实时 OCR 票据扫描、韩语界面与识别、多币种准备、酒店水单复核改进，以及 Pro 高级搜索、订阅异常、月结包和自动化规则。"
  zh-Hant:
    promotionalText: "截圖、拍照或說一句話，AutoLedger 會先整理金額、商戶和時間，等你確認後再寫入本機帳本。現已支援即時 OCR 與酒店水單歸檔。"
    description: |-
      AutoLedger - 一鍵記帳

      把截圖、收據、語音和酒店水單整理成你的個人帳本。

      AutoLedger 是一款本機優先的個人帳本 App，幫助你減少重複輸入，輕鬆記錄日常消費。你可以從已經存在的消費資訊開始：付款截圖、收據照片、語音記錄、捷徑，以及酒店水單。

      即時 OCR 可以快速辨識票據和帳單中的金額、商戶和時間。辨識結果會在儲存前進入確認流程，你可以檢查、修改後再寫入帳本。AutoLedger 不會未經確認自動建立交易，讓你始終掌握自己的消費記錄。

      快速記錄

      支援截圖記帳、拍照辨識、語音記帳、文字輸入、捷徑、分享延伸功能和 Apple Watch 快速記錄。

      透過多帳本管理、自訂分類、消費趨勢、月度報告、資料匯入匯出和 iCloud 同步，幫助你長期維護自己的消費歷史。

      酒店消費歸檔

      旅行和商務住宿通常比普通消費包含更多資訊。酒店水單可能包含入住日期、晚數、房費、稅費、服務費、餐飲和其他消費。

      AutoLedger 可以整理酒店水單 PDF，將住宿資訊和消費記錄儲存為結構化酒店檔案，方便回顧旅行經歷和管理商務支出。

      Apple 生態體驗

      在 iPhone、iPad、Mac 和 Apple Watch 上使用 AutoLedger。手機快速記錄，大螢幕整理查看，隨時保持自己的帳本更新。

      AutoLedger Pro

      Pro 提供更多節省時間的自動化能力，包括酒店水單自動整理、專屬水單收件匣、批次候選處理、進階搜尋、訂閱異常提醒、月結資料整理和進階規則自動化。

      基礎記帳能力長期可用。Pro 的目標是減少重複操作，而不是限制你的帳本資料。
    keywords: "記帳,帳本,截圖記帳,飯店水單,訂閱管理,月報,捷徑,OCR"
    supportUrl: "https://getautoledger.app/support"
    marketingUrl: "https://getautoledger.app"
    whatsNew: "新增即時 OCR 票據掃描、韓語介面與識別、多幣種準備、飯店水單複核改進，以及 Pro 進階搜尋、訂閱異常、月結包和自動化規則。"
  en-US:
    promotionalText: "Screenshot, photo, or one sentence: AutoLedger organizes amount, merchant, and time, then saves locally after confirmation. Now with live OCR and hotel folio archiving."
    description: |-
      AutoLedger - Quick Ledger

      Turn screenshots, receipts, voice notes, and hotel folios into your personal ledger.

      AutoLedger is a local-first personal ledger app that helps reduce repetitive entry and makes everyday spending easier to record. Start from information you already have: payment screenshots, receipt photos, voice notes, Shortcuts, and hotel folios.

      Live OCR quickly recognizes amounts, merchants, and times from receipts and bills. Every result enters a confirmation flow before it is saved, so you can review and edit it first. AutoLedger never creates a transaction without your confirmation, keeping you in control of your records.

      Quick Capture

      Record with screenshots, receipt photos, voice, text, Shortcuts, the Share Extension, and quick entry on Apple Watch.

      Multiple ledgers, custom categories, spending trends, monthly reports, import and export, and iCloud sync help you maintain a useful spending history over time.

      Hotel Expense Archive

      Travel and business stays often contain more detail than ordinary expenses. A hotel folio may include stay dates, nights, room charges, taxes, service fees, dining, and other charges.

      AutoLedger organizes hotel folio PDFs and saves stay details and expenses as structured hotel records for reviewing trips and managing business spending.

      Apple Ecosystem

      Use AutoLedger on iPhone, iPad, Mac, and Apple Watch. Capture quickly on your phone, organize on a larger screen, and keep your ledger up to date.

      AutoLedger Pro

      Pro adds time-saving automation, including hotel folio organization, a dedicated folio inbox, batch candidate processing, advanced search, subscription anomaly alerts, month-end document organization, and advanced rule automation.

      Core bookkeeping remains available for the long term. Pro is designed to reduce repetitive work, not restrict access to your ledger data.
    keywords: "ledger,expense,receipt OCR,hotel folio,subscriptions,monthly report,Shortcuts"
    supportUrl: "https://getautoledger.app/support"
    marketingUrl: "https://getautoledger.app"
    whatsNew: "Adds live OCR receipt scanning, Korean UI and recognition, multi-currency preparation, hotel folio review improvements, and Pro automation for search, subscriptions, monthly exports, and rules."
  ja:
    promotionalText: "スクリーンショット、撮影、または一言で入力。AutoLedger が金額、店舗、時刻を先に整理し、確認後にローカル台帳へ保存します。リアルタイム OCR とホテル明細の保管に対応しました。"
    description: |-
      AutoLedger - かんたん記帳

      スクリーンショット、レシート、音声、ホテル明細を自分の台帳に整理します。

      AutoLedger は、繰り返し入力を減らし、日々の支出を手軽に記録できるローカル優先の個人向け台帳 App です。支払い画面のスクリーンショット、レシート写真、音声メモ、ショートカット、ホテル明細など、すでにある情報から始められます。

      リアルタイム OCR がレシートや請求書の金額、店舗、時刻をすばやく認識します。認識結果は保存前に確認画面へ進み、内容を確認・修正してから台帳へ保存できます。AutoLedger が確認なしに取引を自動作成することはなく、記録の管理は常に利用者の手元にあります。

      すばやく記録

      スクリーンショット、撮影、音声、テキスト、ショートカット、共有拡張、Apple Watch のクイック入力に対応します。

      複数台帳、カスタムカテゴリ、支出傾向、月次レポート、データの読み込み・書き出し、iCloud 同期で、長期的な支出履歴を管理できます。

      ホテル支出の保管

      旅行や出張の宿泊記録には、通常の支出より多くの情報が含まれます。ホテル明細には、宿泊日、泊数、客室料金、税金、サービス料、飲食、その他の請求が記載されることがあります。

      AutoLedger はホテル明細 PDF を整理し、宿泊情報と支出を構造化されたホテル記録として保存します。旅行の振り返りや出張費の管理に役立ちます。

      Apple エコシステム

      iPhone、iPad、Mac、Apple Watch で AutoLedger を利用できます。iPhone ですばやく記録し、大きな画面で整理・確認しながら、台帳を最新の状態に保てます。

      AutoLedger Pro

      Pro では、ホテル明細の自動整理、専用明細受信箱、候補の一括処理、高度な検索、サブスクリプション異常通知、月末資料の整理、高度なルール自動化など、時間を節約する機能を利用できます。

      基本の記帳機能は長期的に利用できます。Pro は台帳データへのアクセスを制限するものではなく、繰り返し作業を減らすための機能です。
    keywords: "記帳,家計簿,レシートOCR,ホテル明細,サブスク,月次レポート,ショートカット"
    supportUrl: "https://getautoledger.app/support"
    marketingUrl: "https://getautoledger.app"
    whatsNew: "リアルタイム OCR スキャン、韓国語 UI と認識、多通貨準備、ホテル明細確認の改善、Pro の検索・サブスク・月次出力・ルール自動化を追加しました。"
  ko:
    promotionalText: "스크린샷을 찍거나 영수증을 촬영하거나 한마디로 말하세요. AutoLedger가 금액, 가맹점, 시간을 먼저 정리하고 확인 후 로컬 장부에 저장합니다. 이제 실시간 OCR과 호텔 명세서 보관을 지원합니다."
    description: |-
      AutoLedger - 빠른 가계부

      스크린샷, 영수증, 음성, 호텔 명세서를 나만의 장부로 정리하세요.

      AutoLedger는 반복 입력을 줄이고 일상 지출을 쉽게 기록할 수 있도록 돕는 로컬 우선 개인 장부 앱입니다. 결제 스크린샷, 영수증 사진, 음성 기록, 단축어, 호텔 명세서처럼 이미 있는 소비 정보에서 시작할 수 있습니다.

      실시간 OCR은 영수증과 청구서의 금액, 가맹점, 시간을 빠르게 인식합니다. 인식 결과는 저장 전에 확인 단계로 이동하며, 내용을 검토하고 수정한 뒤 장부에 저장할 수 있습니다. AutoLedger는 확인 없이 거래를 자동 생성하지 않으므로 소비 기록을 항상 직접 관리할 수 있습니다.

      빠른 기록

      스크린샷 기록, 사진 인식, 음성 기록, 텍스트 입력, 단축어, 공유 확장, Apple Watch 빠른 기록을 지원합니다.

      여러 장부, 사용자 지정 카테고리, 지출 추세, 월간 리포트, 데이터 가져오기와 내보내기, iCloud 동기화로 장기적인 소비 기록을 관리할 수 있습니다.

      호텔 지출 보관

      여행과 출장 숙박에는 일반 지출보다 더 많은 정보가 포함됩니다. 호텔 명세서에는 투숙 날짜, 숙박 일수, 객실 요금, 세금, 서비스 요금, 식음료와 기타 비용이 포함될 수 있습니다.

      AutoLedger는 호텔 명세서 PDF를 정리하고 숙박 정보와 지출을 구조화된 호텔 기록으로 저장하여 여행을 돌아보고 출장비를 관리하기 쉽게 합니다.

      Apple 생태계

      iPhone, iPad, Mac, Apple Watch에서 AutoLedger를 사용하세요. 휴대폰에서 빠르게 기록하고 큰 화면에서 정리하고 확인하며 장부를 최신 상태로 유지할 수 있습니다.

      AutoLedger Pro

      Pro는 호텔 명세서 자동 정리, 전용 명세서 받은편지함, 후보 일괄 처리, 고급 검색, 구독 이상 알림, 월말 자료 정리, 고급 규칙 자동화 등 시간을 절약하는 자동화 기능을 제공합니다.

      기본 기록 기능은 장기적으로 사용할 수 있습니다. Pro의 목적은 장부 데이터 접근을 제한하는 것이 아니라 반복 작업을 줄이는 것입니다.
    keywords: "가계부,장부,영수증OCR,호텔명세서,구독관리,월간보고서,단축어"
