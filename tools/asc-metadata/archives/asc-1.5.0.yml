    en-GB:
      id: bbb661e4-1a1a-4c32-ae00-0b05c5ab296e
      description: |-
        AutoLedger is a local-first personal automated ledger. It extracts expense information from screenshots, receipts, voice input, the clipboard, Shortcuts, and hotel folio PDFs, then turns it into reviewable ledger entries.

        It is not just another manual bookkeeping app. AutoLedger focuses on reducing repetitive input and organizing scattered expense materials such as payment screenshots, paper or digital receipts, subscriptions, and hotel folios.

        【Quick Capture】

        * Recognize expenses from screenshots and receipt photos
        * Extract amount, merchant, date, time, and category
        * Add entries with voice, for example “lunch 28”
        * Import from the clipboard, Share Extension, Shortcuts, Siri, and App Intents
        * Use the iPhone Action Button, Control Center Widget, and Apple Watch for quick entry

        【Across Apple Devices】

        AutoLedger supports iPhone, iPad, Mac, Apple Watch, Apple TV, and Apple Vision.

        Use iPhone for fast screenshot recognition and voice bookkeeping, iPad and Mac for reviewing entries, organizing hotel folios, and checking reports, Apple Watch for quick entry, and Apple TV or Apple Vision for ledger overviews and monthly reports.

        【Automatic Organization】

        * Rule-based and intelligent parsing for common receipts, payment screenshots, and bill text
        * Category learning remembers your corrections and reduces repeated editing
        * Multi-ledger support, category statistics, monthly reports, and merchant rankings
        * JSON import / export and iCloud backup for migration and recovery

        【Hotel Expenses】

        AutoLedger can organize hotel folios into reviewable stay records, not just a single OCR amount.

        You can manually import a hotel folio PDF and review fields such as hotel name, stay dates, nights, room charges, taxes, service fees, food and beverage, other charges, total amount, and payment method. After confirmation, AutoLedger creates a hotel stay record and links it to a normal ledger transaction.

        【AutoLedger Pro】

        Core bookkeeping stays free. AutoLedger Pro unlocks time-saving automation instead of locking your ledger.

        Pro includes:

        * Local email folio scanning
        * Dedicated hotel folio inbox
        * Batch candidate import
        * Advanced deduplication and automatic organization
        * More Pro automation features in future updates

        Without Pro, you can still add entries manually, recognize a single screenshot, use voice bookkeeping, manually import hotel folio PDFs, view and edit history, use basic monthly reports, and export or back up your data.

        【Privacy & Local-First Design】

        AutoLedger does not require an account by default. Core ledger data stays on your device. Recognized results enter a review flow before saving, so you can check and edit them first. The cloud folio inbox only processes hotel folio candidates that you choose to forward to an AutoLedger address. It does not log in to or scan your private mailbox.

        AutoLedger is useful for everyday bookkeeping, travel expense organization, business trip hotel folio archives, and anyone who wants to spend less time entering the same details again and again.

        Terms of Use (EULA): https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
