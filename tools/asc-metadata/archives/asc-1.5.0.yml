        * 支援 iPhone 操作按鈕、控制中心 Widget 和 Apple Watch 快速記錄

        【多平台使用】

        AutoLedger 支援 iPhone、iPad、Mac、Apple Watch、Apple TV 和 Apple Vision。

        你可以在 iPhone 上快速辨識截圖和語音記帳，在 iPad 和 Mac 上複核帳單、整理飯店水單和查看統計，在 Apple Watch 上快速補記，在 Apple TV 或 Apple Vision 上查看帳本概覽和月度報告。

        【自動整理】

        * 規則引擎與智慧解析結合，辨識常見支付截圖、收據和帳單文字
        * 分類學習會記住你的修正，減少重複編輯
        * 支援多帳本、分類統計、月度報告和商戶排行
        * 支援 JSON 匯入匯出與 iCloud 備份，便於遷移和恢復

        【飯店消費模組】

        AutoLedger 可以把飯店水單整理成住宿消費檔案，而不只是辨識一筆總金額。

        你可以手動匯入飯店水單 PDF，辨識飯店名稱、入住退房日期、晚數、房費、稅費、服務費、餐飲、其他消費、總額、支付方式等資訊。確認後，AutoLedger 會產生飯店消費記錄，並關聯到普通帳本流水。

