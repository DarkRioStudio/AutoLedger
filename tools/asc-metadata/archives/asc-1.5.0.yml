        * Improved hotel folio recognition, review, posting, and localized copy
        * Improved iPhone, iPad, Mac, Apple Watch, Apple TV, and Apple Vision experience
        * Screenshot recognition, voice bookkeeping, manual hotel PDF import, and history editing remain free
