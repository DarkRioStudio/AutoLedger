        AutoLedger 預設不需要帳號。核心帳本資料保存在本機。辨識結果會先進入待確認流程，保存前你可以檢查和修改。雲端水單收件箱只處理你主動轉寄到 AutoLedger 地址的飯店水單候選，不會登入或掃描你的私人信箱。

        AutoLedger 適合日常記帳、旅行消費整理、出差飯店水單歸檔，以及想減少重複輸入的個人使用者。

