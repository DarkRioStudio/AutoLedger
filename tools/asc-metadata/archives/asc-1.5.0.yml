    zh-Hans:
      id: 907ee421-5534-4ec5-8648-6267863d9f33
      description: |-
        AutoLedger 是一个本地优先的个人自动化账本。它可以从截图、小票、语音、剪贴板、快捷指令和酒店水单 PDF 中提取消费信息，生成可复核的账本记录。
        它不是又一个需要手工填表的记账 App。AutoLedger 关注的是减少重复输入，把零散的支付截图、纸质或电子小票、周期订阅、酒店水单整理成结构化记录。

        【快速记账】

        * 截图 / 拍照识别账单，自动提取金额、商户、时间和分类
        * 语音快速记账，说一句“午饭 28 元”即可生成待确认记录
        * 支持剪贴板、分享扩展、快捷指令、Siri 和 App Intent
        * 支持 iPhone 操作按钮、控制中心 Widget 和 Apple Watch 快速记录

        【自动整理】

        * 规则引擎与智能解析结合，识别常见支付截图、小票和账单文本
        * 分类学习会记住你的修正，减少重复编辑
        * 支持多账本、分类统计、月度报告和商户排行
        * 支持 JSON 导入导出与 iCloud 备份，便于迁移和恢复

        【酒店水单归档】
        AutoLedger 可以把酒店水单整理成住宿消费档案，而不只是识别一笔总金额。

        你可以手动导入酒店水单 PDF，识别酒店名称、入住退房日期、晚数、房费、税费、服务费、餐饮、其他消费、总额、支付方式等信息。确认后，AutoLedger 会生成酒店消费记录，并关联到普通账本流水。

        【AutoLedger Pro】
        基础记账能力会长期免费。AutoLedger Pro 解锁的是节省时间的自动化能力，而不是锁住你的账本。

        Pro 包括：

        * 本地邮箱水单扫描
        * 专属酒店水单收件箱
        * 批量候选导入
        * 高级去重与自动整理
        * 后续更多 Pro 自动化能力

        没有 Pro，你仍然可以手动记账、识别单张截图、语音记账、手动导入酒店水单 PDF、查看和编辑历史记录、使用基础月报和导出备份。

        【隐私与本地优先】
        AutoLedger 默认不需要账号。核心账本数据保存在本机。识别结果会先进入待确认流程，保存前你可以检查和修改。云端水单收件箱只处理你主动转发到 AutoLedger 地址的酒店水单候选，不会登录或扫描你的私人邮箱。

        AutoLedger 适合日常记账、旅行消费整理、出差酒店水单归档，以及想减少重复输入的个人用户。

        使用条款（EULA）：https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
