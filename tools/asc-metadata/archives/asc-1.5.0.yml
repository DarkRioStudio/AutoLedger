    ja:
      id: ca4ea4c4-c3ce-423c-819f-2cb7f2915ab2
      description: |-
        AutoLedger はローカルファーストの個人向け自動化家計簿です。スクリーンショット、レシート、音声入力、クリップボード、ショートカット、ホテル明細 PDF から支出情報を抽出し、確認可能な帳簿記録に変換します。

        AutoLedger は、手入力を前提にした単なる家計簿 App ではありません。支払いスクリーンショット、紙または電子レシート、サブスクリプション、ホテル明細など、散らばりやすい支出情報を整理し、繰り返し入力を減らすことに重点を置いています。

        【かんたん記帳】

        * スクリーンショット / レシート写真から支出を認識
        * 金額、店舗名、日時、カテゴリを抽出
        * 「ランチ 28 元」のような音声入力から確認待ち記録を作成
        * クリップボード、共有拡張、ショートカット、Siri、App Intent に対応
        * iPhone のアクションボタン、Control Center Widget、Apple Watch から素早く記録

        【Apple デバイスで利用】

        AutoLedger は iPhone、iPad、Mac、Apple Watch、Apple TV、Apple Vision に対応しています。

        iPhone ではスクショ認識や音声記帳をすばやく行い、iPad と Mac では記録の確認、ホテル明細の整理、レポート確認を行えます。Apple Watch では素早く記録し、Apple TV や Apple Vision では帳簿の概要や月次レポートを確認できます。

        【自動整理】

        * ルールエンジンとスマート解析で、一般的な支払い画面、レシート、明細テキストを整理
        * カテゴリ学習により、ユーザーの修正を次回以降に活用
        * 複数台帳、カテゴリ別集計、月次レポート、店舗ランキングに対応
        * JSON インポート / エクスポートと iCloud バックアップで移行と復元をサポート

        【ホテル支出モジュール】

        AutoLedger はホテル明細を単なる 1 件の金額として扱わず、確認可能な宿泊支出記録として整理します。

        ホテル明細 PDF を手動で取り込み、ホテル名、宿泊日、泊数、宿泊料金、税、サービス料、飲食、その他料金、合計、支払い方法などを確認できます。確認後、AutoLedger はホテル宿泊記録を作成し、通常の支出取引と関連付けます。

        【AutoLedger Pro】

        基本的な記帳機能は継続して無料で利用できます。AutoLedger Pro は、台帳へのアクセスを制限するものではなく、時間を節約する自動化機能を解放します。

        Pro に含まれる内容：

        * ローカルメール明細スキャン
        * 専用ホテル明細受信箱
        * 候補の一括取り込み
        * 高度な重複排除と自動整理
        * 今後追加される Pro 自動化機能

        Pro がなくても、手動記帳、単一スクリーンショット認識、音声記帳、手動ホテル明細 PDF 取り込み、履歴の確認と編集、基本レポート、エクスポートとバックアップは引き続き利用できます。

        【プライバシーとローカルファースト】

        AutoLedger は標準ではアカウントを必要としません。主要な帳簿データは端末内に保存されます。認識結果は保存前に確認でき、必要に応じて編集できます。クラウド明細受信箱は、ユーザーが AutoLedger アドレスへ転送したホテル明細候補のみを処理します。ユーザーの個人メールボックスへログインしたり、スキャンしたりすることはありません。

        AutoLedger は、日常の記帳、旅行支出の整理、出張後のホテル明細アーカイブ、そして繰り返し入力を減らしたい個人ユーザーに向いています。

        利用規約（EULA）：https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
