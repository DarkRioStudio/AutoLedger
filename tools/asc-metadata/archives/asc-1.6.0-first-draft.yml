      如果使用者啟用 iCloud 同步，帳本資料會透過使用者自己的 Apple iCloud 帳號同步；開發者無法存取這些資料。截圖辨識、水單 PDF、郵箱掃描、雲端水單收件箱和 Pro 自動化功能主要在 iPhone、iPad 和 Mac 上使用。辨識或轉寄水單結果在儲存到正式帳本前仍需使用者確認。

      詳情請查看：https://getautoledger.app/privacy
