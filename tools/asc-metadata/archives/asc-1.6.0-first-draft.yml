      如果用户启用 iCloud 同步，账本数据会通过用户自己的 Apple iCloud 账户同步；开发者无法访问这些数据。截图识别、水单 PDF、邮箱扫描、云端水单收件箱和 Pro 自动化功能主要在 iPhone、iPad 和 Mac 上使用。识别或转发水单结果在保存到正式账本前仍需用户确认。

