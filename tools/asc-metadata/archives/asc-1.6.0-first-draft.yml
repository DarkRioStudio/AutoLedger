    subtitle: 截图识别账单，语音快速记账
    privacyPolicyUrl: https://app.darkrio326.top/autoledger/privacy
    privacyPolicyText: |-
      AutoLedger はローカル優先の支出記録アプリです。Apple TV 版では、既存の台帳サマリー、最近の記録、カテゴリ統計、月次レポートを表示できます。Apple TV 版は、アカウント情報、連絡先、支払い情報、写真、位置情報、ヘルスケアデータ、その他の個人データを収集しません。

      iCloud 同期を有効にした場合、台帳データはユーザー自身の Apple iCloud アカウントを通じて同期され、開発者はそのデータにアクセスできません。レシート画像認識、ホテル明細 PDF、メールスキャン、クラウド明細受信箱、Pro 自動化機能は主に iPhone、iPad、Mac で利用します。認識または転送されたホテル明細の結果は、正式な台帳に保存される前にユーザーの確認が必要です。

      詳細：https://getautoledger.app/privacy
