    name: 'AutoLedger: Expense Tracker'
    subtitle: Tap Once. Auto-Log Expenses
    privacyPolicyUrl: https://app.darkrio326.top/autoledger/privacy
    privacyPolicyText: |-
      AutoLedger is a local-first expense tracking app. On Apple TV, AutoLedger is used to view existing ledger summaries and reports. The Apple TV app does not collect account information, contacts, payment information, photos, location, health data, or other personal data.

      If the user enables iCloud sync, ledger data is synced through the user's own Apple iCloud account; the developer does not access that data. Receipt screenshots, hotel folio PDFs, email scanning, cloud folio inbox processing, and Pro automation features are primarily available on iPhone, iPad, and Mac. Recognized or forwarded folio results are saved only after user confirmation.

      For details, see https://getautoledger.app/privacy.
