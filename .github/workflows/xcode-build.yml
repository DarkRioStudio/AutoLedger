name: Xcode Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xcode-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xcode-build:
    name: AutoLedgerCore Xcode build
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          shopt -s nullglob

          for candidate in /Applications/Xcode_27*.app /Applications/Xcode-beta.app /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              echo "Selected $candidate"
              xcodebuild -version
              xcodebuild -showsdks
              exit 0
            fi
          done

          echo "No Xcode installation found under /Applications" >&2
          exit 1

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods || sudo gem install cocoapods
          fi
          pod --version

      - name: Install dependencies
        working-directory: AutoLedger
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Build AutoLedgerCore
        run: |
          set -euo pipefail
          mkdir -p build/logs

          echo "Building AutoLedgerCore only. Full app archive remains covered by Xcode Cloud."
          xcodebuild \
            -workspace AutoLedger/AutoLedger.xcworkspace \
            -scheme AutoLedgerCore \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build/logs/xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build/logs/xcodebuild.log
          if-no-files-found: ignore
